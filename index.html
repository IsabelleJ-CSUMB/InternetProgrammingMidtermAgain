<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Have a Laugh</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
   

    <header> 
        <h1 id="joke-title"> Jokes </h1>
    </header>

    
<ul class="nav">
    <li class="nav-item">
        <a class="nav-link" href="jokes.html">
            Jokes
        </a>
    </li>

    <li class="nav-item">
        <a class="nav-link active" aria-current="page" href="noms.html">
            Noms
        </a>
    </li>
</ul>


   
  
  


    <label for="joke-search">Search for joke</label>
    <input id="joke-search">

    <br/>
    

    <div> 
        <label for="language-input"> Language</label>
        <select name="language" id="language-input">
            <option value="en"> English </option>
            <option value="es"> Spanish </option>
        </select>
    </div>
        <br/>

<div class="categories"> 
        <!-- Joke filter button -->
         <label> Select Category</label> 

         <div>
         <input type="checkbox" name="category" id="programming" value="programming"> <label for="programming">Programming</label>
         </div>

         <div>
         <input type="checkbox" name="category" id="dark" value="dark"> <label for="dark">Dark</label>
         </div>

         <div>
         <input type="checkbox" name="category" id="pun" value="pun"> <label for="pun">Pun</label>
         </div>

         <div>
         <input type="checkbox" name="category" id="spooky" value="spooky"> <label for="spooky">Spooky</label>
         </div>

         <div>
         <input type="checkbox" name="category" id="christmas" value="christmas"><label for="christmas">Christmas</label>
         </div>

         <div>
         <input type="checkbox" name="category" id="miscellaneous" value="miscellaneous"> <label for="miscellaneous">Miscellaneous</label>
         </div>
      
         <br/>
</div>

    
<button type="button" id="reset-button" class="btn btn-secondary">
    Reset Filters
</button>




    <main> 

             <!-- for the loop -->
            <div id="joke-output"></div>


    </main>

    <footer> 

        <p> 
            Come laugh with us!
        </p>
    </footer>
    <script src="scripts/scripts.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
